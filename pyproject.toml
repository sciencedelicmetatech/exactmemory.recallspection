[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exactmemory-recallspection"
version = "3.0.0"
description = "Tamper-evident key-value store v3.0.0 - 32-byte HMAC-SHA256, transparency log with hash chain, remote anchor, replay resistance. Zero dependencies pure Python stdlib. BREAKING: 16-byte tags no longer supported."
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "Sciencedelic Metatech", email = "eliamraell@yandex.com" }]
keywords = ["tamper-evident", "hmac", "audit", "exact-memory", "recallspection", "cryptographic", "key-value", "transparency-log"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/sciencedelicmetatech/exactmemory.recallspection"
Repository = "https://github.com/sciencedelicmetatech/exactmemory.recallspection"
Issues = "https://github.com/sciencedelicmetatech/exactmemory.recallspection/issues"
Changelog = "https://github.com/sciencedelicmetatech/exactmemory.recallspection/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["exactmemory*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "main*.py"]
