<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;display=swap');
      .title {
        font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        font-weight: 700;
        font-size: 68px;
        letter-spacing: 12px;
        fill: url(#silverGradient);
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .subtitle {
        font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 6px;
        fill: #a8a8b0;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>

    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e8e8ec"/>
      <stop offset="50%" stop-color="#b8b8c0"/>
      <stop offset="75%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#8a8a92"/>
    </linearGradient>

    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"  stop-color="#1c1c26" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#16161d" stop-opacity="0.0"/>
    </radialGradient>

    <linearGradient id="serpentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c8c8d0"/>
      <stop offset="50%"  stop-color="#8a8a94"/>
      <stop offset="100%" stop-color="#c8c8d0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="#16161d"/>

  <g transform="translate(400, 100)" opacity="0.6">
    <circle cx="0" cy="0" r="82"
            fill="none"
            stroke="url(#serpentGradient)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-dasharray="480 35"
            transform="rotate(-35)"/>
    <circle cx="0" cy="0" r="82"
            fill="none"
            stroke="#5a5a64"
            stroke-width="1"
            opacity="0.6"
            stroke-dasharray="3 6"/>
    <path d="M 78 26 L 88 20 L 92 30 L 82 34 Z"
          fill="#c8c8d0" opacity="0.9"/>
    <path d="M 80 -30
             Q 95 -22, 92 -8
             Q 88 4, 74 6
             Q 68 2, 66 -8
             Q 66 -22, 80 -30 Z"
          fill="#b8b8c0" opacity="0.95"/>
    <circle cx="80" cy="-14" r="1.8" fill="#16161d"/>
    <circle cx="80" cy="-14" r="0.7" fill="#e8e8ec"/>
    <circle cx="0" cy="0" r="60"
            fill="none"
            stroke="#3a3a44"
            stroke-width="0.6"
            opacity="0.5"/>
  </g>

  <rect width="800" height="200" fill="url(#vignette)"/>

  <text x="400" y="88" class="title" filter="url(#silverGlow)">RECALLSPECTION</text>

  <text x="400" y="140" class="subtitle">TAMPER-EVIDENT · REPLAY-RESISTANT · ZERO DEPENDENCIES</text>

  <line x1="80"  y1="20"  x2="720" y2="20"  stroke="#8a8a92" stroke-width="0.5" opacity="0.35"/>
  <line x1="80"  y1="180" x2="720" y2="180" stroke="#8a8a92" stroke-width="0.5" opacity="0.35"/>

  <g stroke="#b8b8c0" stroke-width="1" opacity="0.5">
    <path d="M 30 30 L 30 42 M 30 30 L 42 30" fill="none"/>
    <path d="M 770 30 L 770 42 M 770 30 L 758 30" fill="none"/>
    <path d="M 30 170 L 30 158 M 30 170 L 42 170" fill="none"/>
    <path d="M 770 170 L 770 158 M 770 170 L 758 170" fill="none"/>
  </g>
</svg>
